name: ATP Smoke

on:
  pull_request:
    paths:
      - 'atp/**'
      - 'server/**'
      - 'Automation_Testing.md'
  workflow_dispatch:

jobs:
  atp-smoke-dry:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: atp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm run catalog:sync
      - run: npm run run:smoke:dry
        env:
          ATP_SKIP_LOAD_TESTS: '1'
