name: Production Monitoring

on:
  schedule:
    # Run health checks every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-24.04
    
    steps:
      - name: Check Master Control Plane Health
        run: |
          MASTER_URL="https://${{ secrets.MASTER_DOMAIN }}"
          
          echo "🏥 Checking Master Control Plane..."
          HEALTH=$(curl -s $MASTER_URL/health)
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" $MASTER_URL/health)
          
          if [ $STATUS_CODE -eq 200 ]; then
            echo "✅ Master Control Plane is healthy"
            echo "$HEALTH" | jq '.'
          else
            echo "❌ Master Control Plane health check failed"
            echo "Status Code: $STATUS_CODE"
            exit 1
          fi
      
      - name: Check Instance Registry
        env:
          HEALTH_DETAILS_TOKEN: ${{ secrets.HEALTH_DETAILS_TOKEN }}
        run: |
          MASTER_URL="https://${{ secrets.MASTER_DOMAIN }}"
          
          if [ -z "$HEALTH_DETAILS_TOKEN" ]; then
            echo "⚠️  HEALTH_DETAILS_TOKEN secret not set; /health/status is operator-only, skipping instance statistics"
            exit 0
          fi
          
          echo "📊 Fetching instance statistics..."
          STATS=$(curl -sf -H "X-Health-Token: $HEALTH_DETAILS_TOKEN" "$MASTER_URL/health/status")
          
          echo "$STATS" | jq '.instances'
          
          # Extract key metrics
          TOTAL=$(echo "$STATS" | jq -r '.instances.totalInstances // 0')
          ACTIVE=$(echo "$STATS" | jq -r '.instances.activeInstances // 0')
          UNHEALTHY=$(echo "$STATS" | jq -r '.instances.unhealthyInstances // 0')
          
          echo "Total Instances: $TOTAL"
          echo "Active Instances: $ACTIVE"
          echo "Unhealthy Instances: $UNHEALTHY"
          
          # Alert if there are unhealthy instances
          if [ $UNHEALTHY -gt 0 ]; then
            echo "⚠️  Warning: $UNHEALTHY unhealthy instance(s) detected"
          fi
      
      - name: Alert on failure
        if: failure()
        run: |
          echo "🚨 ALERT: Production monitoring detected an issue!"
          echo "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "Check the logs and investigate immediately."
          # In production, this would send alerts via email, Slack, PagerDuty, etc.

